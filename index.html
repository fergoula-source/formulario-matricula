<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Formulário de Matrícula</title>
</head>

<body>

    <main>

    <section>
        <h1>Formulário de Matrícula</h1>

        <p>
            Preencha os dados abaixo para matricular seu filho
            na escola de educação infantil Estrelas do Amanhã.
        </p>

        <form>

    <h2>Informações da criança</h2>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" placeholder="Qual o nome da criança?">

    <label for="nascimento">Data de nascimento</label>
    <input type="date" id="nascimento">

    <label for="sexo">Sexo</label>
    <select id="sexo">
        <option value="">Selecione</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
    </select>

    <label for="medicas">Informações médicas</label>
    <textarea id="medicas" rows="5"></textarea>

    <label for="certidao">Certidão de nascimento</label>
    <input type="file" id="certidao">

</form>
    </section>

    <aside>
        <h2>Porque cada momento de aprendizado conta</h2>

        <p>
            Inscreva seu filho em nossa escola e veja-o florescer
            em um ambiente acolhedor, seguro e estimulante.
        </p>
    </aside>

</main>

</body>

</html>
